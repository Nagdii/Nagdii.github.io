<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #060a13;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #cbd5e1;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 84px;
      }
      /* dotted grid, mirrors .bg-grid on the site */
      .grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(circle, rgba(148,163,184,0.13) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      /* emerald glow, mirrors the hero */
      .glow {
        position: absolute;
        top: -260px; left: 50%; transform: translateX(-50%);
        width: 900px; height: 520px;
        background: rgba(16,185,129,0.16);
        filter: blur(90px);
        border-radius: 9999px;
      }
      .content { position: relative; }
      .badge {
        display: inline-flex; align-items: center; gap: 10px;
        border: 1px solid rgba(16,185,129,0.32);
        background: rgba(16,185,129,0.10);
        color: #6ee7b7;
        font-size: 19px; font-weight: 600;
        padding: 9px 18px; border-radius: 999px;
        margin-bottom: 30px;
      }
      .dot { width: 9px; height: 9px; border-radius: 999px; background: #34d399; }
      h1 {
        font-size: 78px; line-height: 1.04; font-weight: 700;
        color: #fff; letter-spacing: -0.025em;
      }
      h1 .accent { color: #34d399; }
      .role {
        margin-top: 20px;
        font-size: 33px; font-weight: 600; color: #e2e8f0;
      }
      .tagline {
        margin-top: 16px; font-size: 25px; color: #94a3b8; max-width: 900px;
      }
      .stack {
        margin-top: 38px; display: flex; gap: 11px; flex-wrap: wrap;
      }
      .chip {
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.05);
        border-radius: 11px;
        padding: 10px 19px;
        font-size: 21px; font-weight: 500; color: #e2e8f0;
      }
      .url {
        position: absolute; left: 84px; bottom: 54px;
        font-size: 23px; font-weight: 600; color: #34d399;
      }
      .bar {
        position: absolute; left: 0; right: 0; bottom: 0; height: 7px;
        background: linear-gradient(90deg, #6ee7b7 0%, #10b981 55%, #059669 100%);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="content">
      <span class="badge"><span class="dot"></span>Available for freelance &amp; full-time roles</span>
      <h1>Khaled El Nagdy<span class="accent">.</span></h1>
      <div class="role">Analytics Engineer &amp; BI Developer</div>
      <div class="tagline">From raw data to decisions people trust.</div>
      <div class="stack">
        <span class="chip">Snowflake</span>
        <span class="chip">dbt</span>
        <span class="chip">Power BI</span>
        <span class="chip">SQL</span>
        <span class="chip">DAX</span>
        <span class="chip">Power Query</span>
      </div>
    </div>

    <div class="url">nagdii.github.io</div>
    <div class="bar"></div>
  </body>
</html>
